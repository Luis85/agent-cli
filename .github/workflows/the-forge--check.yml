# Generated by forge workflows sync from src/the-forge/src/infrastructure/workflows/check/check.yml.
# Do not edit this file; change the source and run: node bin/forge.js workflows sync

# Full quality gate for The Forge, authored inside the project. `workflows sync` generates
# .github/workflows/the-forge--check.yml from this file: run steps start in the project directory
# (defaults.run.working-directory) and env.FORGE_PROJECT_PATH names it for action inputs, because
# working-directory applies only to run steps. Paths starting with / are workspace-relative.
name: Check The Forge
# Pushes to pull request branches run once, through the pull_request event. Besides its own files,
# the gate verifies the workspace distribution, the showcase it regenerates and the root guides it links.
on:
  push:
    branches: [ main ]
    paths:
      - src/the-forge/**
      - bin/**
      - src/forge-showcase/**
      - README.md
      - AGENTS.md
      - LICENSE
      - .gitattributes
      - .github/workflows/the-forge--check.yml
  pull_request:
    paths:
      - src/the-forge/**
      - bin/**
      - src/forge-showcase/**
      - README.md
      - AGENTS.md
      - LICENSE
      - .gitattributes
      - .github/workflows/the-forge--check.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
    working-directory: src/the-forge
env:
  FORGE_PROJECT_PATH: src/the-forge
jobs:
  check:
    name: check (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # Windows process creation and filesystem access make the full gate noticeably slower.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        node: [ '22.12.0', 24 ]
    steps:
      # Actions are pinned to full commit SHAs; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ${{ env.FORGE_PROJECT_PATH }}/package-lock.json
      # Release packaging and archive tests require GNU tar as `tar`.
      - name: Put GNU tar on PATH (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew list gnu-tar >/dev/null 2>&1 || brew install gnu-tar
          echo "$(brew --prefix gnu-tar)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Put Git's GNU tar on PATH (Windows)
        if: runner.os == 'Windows'
        run: echo 'C:\Program Files\Git\usr\bin' >> "$GITHUB_PATH"
      - name: Report toolchain
        run: |
          node --version
          npm --version
          tar --version | sed -n 1p
      - run: npm ci
      - name: Full quality gate
        run: npm run check
      - name: Upload quality diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-reports-${{ matrix.os }}-node-${{ matrix.node }}
          path: ${{ env.FORGE_PROJECT_PATH }}/.quality-reports/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      # The committed bundle in the workspace bin/ is the Linux build; other platforms verify behavior, not bytes.
      - name: Verify committed bundle
        if: runner.os == 'Linux'
        run: |
          git -C "$GITHUB_WORKSPACE" diff --exit-code -- bin
          test -z "$(git -C "$GITHUB_WORKSPACE" ls-files --others --exclude-standard bin)"
      - name: Build release archive
        if: runner.os == 'Linux'
        run: node scripts/release.mjs
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: forge-${{ matrix.os }}-node-${{ matrix.node }}
          path: ${{ env.FORGE_PROJECT_PATH }}/release/*
