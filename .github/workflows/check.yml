name: Check The Forge
# Pushes to pull request branches run once, through the pull_request event.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: check (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # Windows process creation and filesystem access make the full gate noticeably slower.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.12.0', 24]
    defaults:
      run:
        shell: bash
    steps:
      # Actions are pinned to full commit SHAs; the comment names the release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Release packaging and archive tests require GNU tar as `tar`.
      - name: Put GNU tar on PATH (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew list gnu-tar >/dev/null 2>&1 || brew install gnu-tar
          echo "$(brew --prefix gnu-tar)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Put Git's GNU tar on PATH (Windows)
        if: runner.os == 'Windows'
        run: echo 'C:\Program Files\Git\usr\bin' >> "$GITHUB_PATH"
      - name: Report toolchain
        run: |
          node --version
          npm --version
          tar --version | sed -n 1p
      - run: npm ci
      - name: Full quality gate
        run: npm run check
      - name: Upload quality diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-reports-${{ matrix.os }}-node-${{ matrix.node }}
          path: .quality-reports/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      # The committed bundle is the Linux build; other platforms verify behavior, not bytes.
      - name: Verify committed bundle
        if: runner.os == 'Linux'
        run: |
          git diff --exit-code -- bin
          test -z "$(git ls-files --others --exclude-standard bin)"
      - name: Build release archive
        if: runner.os == 'Linux'
        run: node scripts/release.mjs
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: forge-${{ matrix.os }}-node-${{ matrix.node }}
          path: release/*
