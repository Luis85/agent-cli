name: Check The Forge
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.12.0', 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Full quality gate
        run: npm run check
      - name: Upload quality diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports-node-${{ matrix.node }}
          path: .quality-reports/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify committed bundle
        run: |
          git diff --exit-code -- bin
          test -z "$(git ls-files --others --exclude-standard bin)"
      - run: node src/infrastructure/scripts/release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: forge-node-${{ matrix.node }}
          path: release/*
