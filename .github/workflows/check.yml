name: Check CLI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify committed bundle
        run: |
          git diff --exit-code -- bin/app
          test -z "$(git ls-files --others --exclude-standard bin/app)"
      - run: node scripts/release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: agent-cli-node-${{ matrix.node }}
          path: release/*
