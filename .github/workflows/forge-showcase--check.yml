# Generated by forge workflows sync from src/forge-showcase/src/infrastructure/workflows/check/check.yml.
# Do not edit this file; change the source and run: node bin/forge.js workflows sync

# Quality gate for the forge-showcase project, authored inside the project.
# The file stays independent of its location: `node bin/forge.js workflows sync` in the
# containing workspace generates .github/workflows/forge-showcase--check.yml from it,
# runs its steps in the project directory, limits push and pull_request triggers to
# the project's files and sets env.FORGE_PROJECT_PATH for action inputs such as the cache path.
name: forge-showcase check

on:
  push:
    branches: [ main ]
    paths:
      - src/forge-showcase/**
      - .github/workflows/forge-showcase--check.yml
  pull_request:
    paths:
      - src/forge-showcase/**
      - .github/workflows/forge-showcase--check.yml
  workflow_dispatch:

permissions:
  contents: read
env:
  FORGE_PROJECT_PATH: src/forge-showcase
defaults:
  run:
    working-directory: src/forge-showcase

jobs:
  check:
    name: Install, check and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [ '22.12.0', 24 ]
    steps:
      # Actions are pinned to full commit SHAs; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ${{ env.FORGE_PROJECT_PATH }}/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Structure, lint, analysis, types, builds and tests
        run: npm run check
