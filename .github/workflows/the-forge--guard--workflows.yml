# Generated by forge workflows sync from src/the-forge/src/infrastructure/workflows/guard/workflows.yml.
# Do not edit this file; change the source and run: node bin/forge.js workflows sync

# Fails a pull request whose generated .github/workflows entrypoints drift from the workflows that
# managed projects author under src/infrastructure/workflows/<concern>/. The committed bundle needs
# only Node, so no install step runs. The leading / makes the path filter workspace-relative.
name: Workflow drift
on:
  pull_request:
    paths:
      - "**"
      - .github/workflows/the-forge--guard--workflows.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workflows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  FORGE_PROJECT_PATH: src/the-forge
defaults:
  run:
    working-directory: src/the-forge
jobs:
  workflows:
    name: workflows sync --check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Actions are pinned to full commit SHAs; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.12.0'
      # The executable resolves the workspace from its own location, independent of the working directory.
      - name: Check generated workflows
        run: node "$GITHUB_WORKSPACE/bin/forge.js" workflows sync --check
