id: list-folder
title: List the notes of one folder
category: reading
prompt: |
  Inspect the Projects folder with stat to obtain its current revision and counts.
  Which notes are in that folder? Answer with their paths and leave them unchanged.
fixture: vault
reference:
  - [stat, Projects]
  - [list, --path, "Projects/**"]
answer: Projects/Alpha.md and Projects/Beta.md
checks:
  - answer: { items: [Projects/Alpha.md, Projects/Beta.md] }
  - unchanged: Projects/Alpha.md
  - unchanged: Projects/Beta.md
  - command: [stat, Projects]
    data: { pointer: /kind, equals: folder }
  # The fixture also has projects/demo, which shares the Projects folder on case-insensitive filesystems,
  # so the descendant counts are checked on a folder without a case collision.
  - command: [stat, Meetings]
    data: { pointer: /fileCount, equals: 1 }
  - command: [stat, Meetings]
    data: { pointer: /folderCount, equals: 0 }
  - command: [stat, Projects]
    data: { pointer: /revision, length: 64 }
