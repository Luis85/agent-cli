id: recover-not-found
title: Recover from a wrong path by searching
category: error-recovery
prompt: |
  Set the status of the offline maps project note, Projects/Offline.md, to active.
  If that path does not exist, find the right note instead of creating a new one.
fixture: vault
reference:
  - run: [read, Projects/Offline.md]
    expect: { code: NOT_FOUND }
  - [search, offline maps]
  - [properties, Projects/Beta.md, --set, '{"status":"active"}', --if-match, "{{revision:Projects/Beta.md}}"]
checks:
  - file: Projects/Beta.md
    frontmatter: { status: active, tags: [project] }
  - file: Projects/Offline.md
    exists: false
