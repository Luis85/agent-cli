# Mutation testing for The Forge, authored inside the project. `workflows sync` generates
# .github/workflows/the-forge--mutation.yml from this file: run steps start in the project directory
# (defaults.run.working-directory) and env.FORGE_PROJECT_PATH names it for action inputs, because
# working-directory applies only to run steps. Paths starting with / are workspace-relative.
name: Mutation The Forge
# Stryker mutates the domain code named in stryker.config.json and runs only unit tests, so the workflow
# triggers only through code, tests or its toolchain. Mutation testing runs in CI only. This workflow is
# advisory: it is not part of `npm run check` and must not be a required status check (its path filter
# would leave unrelated pull requests waiting). Pushes to main refresh the cached baseline that pull
# requests restore; the weekly run re-tests every mutant.
on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'scripts/mutation/**', 'stryker.config.json', 'vitest.config.ts', 'vitest.mutation.config.ts', 'package.json', 'package-lock.json']
  pull_request:
    paths: ['src/**', 'tests/**', 'scripts/mutation/**', 'stryker.config.json', 'vitest.config.ts', 'vitest.mutation.config.ts', 'package.json', 'package-lock.json']
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
# A cancelled run saves nothing, so only superseded pull request runs are cancelled. Other runs wait for the
# running one, but a group holds only one pending run and a newer run replaces it: a pending push run gives way
# to the next push, which tests a newer commit. The weekly forced run has its own group, so no push replaces it.
concurrency:
  group: mutation-${{ github.workflow }}-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  # scripts/mutation/shard.mjs splits the files that `mutate` selects into two shards balanced by size. Keep
  # the shard count in the matrix, the restore and download steps and the merge command in sync.
  shard:
    name: mutation shard ${{ matrix.shard }}/2 (ubuntu-latest, Node 24)
    runs-on: ubuntu-latest
    # A forced run of the whole scope takes about 25 minutes on four cores, so each forced shard takes about
    # 13 (budget 25); incremental pull request runs reuse earlier results and take a few minutes.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      # Actions are pinned to full commit SHAs; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ env.FORGE_PROJECT_PATH }}/package-lock.json
      # Stryker's incremental file records earlier results, so a rerun tests only mutants whose code or tests
      # changed. Each shard saves its own file; pull requests restore the latest one saved on their branch or the
      # default branch. Incremental mode cannot see toolchain or shared test helper changes, so the lockfile,
      # the mutation configuration, the scripts and tests/support key the cache.
      - name: Hash the mutation toolchain
        id: toolchain
        env:
          TOOLCHAIN: ${{ hashFiles(format('{0}/package-lock.json', env.FORGE_PROJECT_PATH), format('{0}/stryker.config.json', env.FORGE_PROJECT_PATH), format('{0}/vitest*.config.ts', env.FORGE_PROJECT_PATH), format('{0}/scripts/mutation/**', env.FORGE_PROJECT_PATH), format('{0}/tests/support/**', env.FORGE_PROJECT_PATH)) }}
        run: echo "hash=$TOOLCHAIN" >> "$GITHUB_OUTPUT"
      # Every shard restores the results of both shards: a file that moves to the other shard when sizes change
      # keeps its earlier results, because shard.mjs seeds its incremental file from all of them.
      - name: Restore shard 1 results
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.FORGE_PROJECT_PATH }}/.quality-reports/mutation/shard-1/incremental.json
          key: mutation-${{ steps.toolchain.outputs.hash }}-shard-1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mutation-${{ steps.toolchain.outputs.hash }}-shard-1-
      - name: Restore shard 2 results
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.FORGE_PROJECT_PATH }}/.quality-reports/mutation/shard-2/incremental.json
          key: mutation-${{ steps.toolchain.outputs.hash }}-shard-2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mutation-${{ steps.toolchain.outputs.hash }}-shard-2-
      - name: Report toolchain
        run: |
          node --version
          npm --version
      - run: npm ci
      # The scheduled run passes --force: it re-tests every mutant instead of trusting the incremental file.
      # Shards never apply thresholds.break; the merge job judges the overall score.
      - name: Mutation testing
        id: mutate
        env:
          SHARD: ${{ matrix.shard }}
          FORCE: ${{ github.event_name == 'schedule' && '--force' || '' }}
        run: node scripts/mutation/shard.mjs --shard "$SHARD/2" $FORCE
      # Restore and save are separate steps: the combined cache action saves only after a successful job, so a
      # failed run would discard the results it just computed.
      - name: Save shard results
        if: ${{ !cancelled() && steps.mutate.outcome != 'skipped' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.FORGE_PROJECT_PATH }}/.quality-reports/mutation/shard-${{ matrix.shard }}/incremental.json
          key: mutation-${{ steps.toolchain.outputs.hash }}-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
      # The shard directory holds the reports, the incremental file and plan.json, the shard's planned files,
      # which the merge compares with its report.
      - name: Upload shard report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: ${{ env.FORGE_PROJECT_PATH }}/.quality-reports/mutation/shard-${{ matrix.shard }}/
          if-no-files-found: warn
          retention-days: 14
  # Merges the shard reports, writes the score table to the job summary and applies thresholds.break from
  # stryker.config.json to the overall score. It needs only Node, so it skips npm ci.
  merge:
    name: mutation score (ubuntu-latest, Node 24)
    needs: shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: mutation-shard-1
          path: ${{ env.FORGE_PROJECT_PATH }}/.quality-reports/mutation/shard-1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: mutation-shard-2
          path: ${{ env.FORGE_PROJECT_PATH }}/.quality-reports/mutation/shard-2
      # Fails on a missing or empty shard report or plan, on a report whose files differ from its shard's plan,
      # and when the overall score is below thresholds.break.
      - name: Merge shard reports
        run: node scripts/mutation/merge.mjs --shards 2
      - name: Upload mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: ${{ env.FORGE_PROJECT_PATH }}/.quality-reports/mutation/
          if-no-files-found: ignore
          retention-days: 14
      # A shard that failed or timed out may still have uploaded a report; the run fails either way.
      - name: Require every shard to succeed
        if: ${{ needs.shard.result != 'success' }}
        env:
          SHARDS: ${{ needs.shard.result }}
        run: |
          echo "::error::A mutation shard did not succeed (result: $SHARDS)"
          exit 1
