# Full quality gate for The Forge, authored inside the project. `workflows sync` generates
# .github/workflows/the-forge--check.yml from this file: run steps start in the project directory
# (defaults.run.working-directory) and env.FORGE_PROJECT_PATH names it for action inputs, because
# working-directory applies only to run steps. Paths starting with / are workspace-relative.
name: Check The Forge
# Pushes to pull request branches run once, through the pull_request event. Besides its own files,
# the gate verifies the workspace distribution, the showcase it regenerates and the root guides it links.
on:
  push:
    branches: [main]
    paths: ['**', '/bin/**', '/src/forge-showcase/**', '/README.md', '/AGENTS.md', '/LICENSE', '/.gitattributes']
  pull_request:
    paths: ['**', '/bin/**', '/src/forge-showcase/**', '/README.md', '/AGENTS.md', '/LICENSE', '/.gitattributes']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  check:
    name: check (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # Windows process creation and filesystem access make the full gate noticeably slower.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.12.0', 24]
    steps:
      # Actions are pinned to full commit SHAs; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ${{ env.FORGE_PROJECT_PATH }}/package-lock.json
      # Release packaging and archive tests require GNU tar as `tar`.
      - name: Put GNU tar on PATH (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew list gnu-tar >/dev/null 2>&1 || brew install gnu-tar
          echo "$(brew --prefix gnu-tar)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Put Git's GNU tar on PATH (Windows)
        if: runner.os == 'Windows'
        run: echo 'C:\Program Files\Git\usr\bin' >> "$GITHUB_PATH"
      - name: Report toolchain
        run: |
          node --version
          npm --version
          tar --version | sed -n 1p
      - run: npm ci
      # The browser download is keyed on the locked playwright-core version; the system packages install every run.
      - name: Read the locked Playwright version
        id: playwright
        if: runner.os == 'Linux' && matrix.node == 24
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        if: runner.os == 'Linux' && matrix.node == 24
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium for native browser acceptance
        if: runner.os == 'Linux' && matrix.node == 24
        run: npx playwright-core install chromium --no-shell --with-deps
      - name: Full quality gate
        env:
          FORGE_BROWSER_TESTS: ${{ runner.os == 'Linux' && matrix.node == 24 && '1' || '0' }}
        run: npm run check
      - name: Upload quality diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-reports-${{ matrix.os }}-node-${{ matrix.node }}
          path: ${{ env.FORGE_PROJECT_PATH }}/.quality-reports/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      # The committed bundle in the workspace bin/ is the Linux build; other platforms verify behavior, not bytes.
      - name: Verify committed bundle
        if: runner.os == 'Linux'
        run: |
          git -C "$GITHUB_WORKSPACE" diff --exit-code -- bin
          test -z "$(git -C "$GITHUB_WORKSPACE" ls-files --others --exclude-standard bin)"
      # The archive is platform-independent and reproducible: one leg builds it for the installation jobs.
      - name: Build release archive
        if: runner.os == 'Linux' && matrix.node == 24
        run: node scripts/release.mjs
      - if: runner.os == 'Linux' && matrix.node == 24
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: forge-release-candidate
          path: ${{ env.FORGE_PROJECT_PATH }}/release/*
          if-no-files-found: error
          retention-days: 7
  install:
    name: Fresh installation (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.12.0', 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: forge-release-candidate
          path: ${{ env.FORGE_PROJECT_PATH }}/release
      # This uses only Node and the runner's tar, without npm or source dependencies.
      - name: Install and use the release archive in a fresh workspace
        run: node scripts/release-smoke.mjs release
